name: Build and Verify mar-firmware (RPi ARM64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware on Self-Hosted Raspberry Pi
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Firmware via PlatformIO Docker Container
        run: |
          echo "Building firmware verification image on Raspberry Pi ARM64..."
          docker build -t mar-firmware:latest .
