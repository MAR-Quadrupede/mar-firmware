; PlatformIO Project Configuration File for M.A.R. Low-Level Firmware
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = mega2560
src_dir = mar_stereovision_controller

[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
